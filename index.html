<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крипто Борщ</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000;
            display:flex; justify-content:center; align-items:center;
            height:100vh; overflow:hidden;
            font-family:'Arial',sans-serif;
            touch-action:manipulation; user-select:none;
            -webkit-tap-highlight-color:transparent;
        }
        #game-container {
            position:relative; width:100%; max-width:420px; height:100vh;
            background:linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #4682B4 70%);
            overflow:hidden;
        }
        .sky { position:absolute; top:0; left:0; right:0; height:40%; }
        .horizon { position:absolute; top:35%; left:0; right:0; height:2px; background:rgba(255,255,255,0.5); }
        .sea {
            position:absolute; top:35%; left:0; right:0; bottom:30%;
            background:linear-gradient(180deg, #1E90FF, #4169E1);
            animation:waves 3s infinite ease-in-out;
        }
        @keyframes waves { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
        .yacht { position:absolute; right:10%; top:38%; width:70px; height:100px; animation:float 4s infinite ease-in-out; }
        @keyframes float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
        .yacht-body { position:absolute; bottom:0; left:5px; width:60px; height:20px; background:white; border-radius:50% 50% 0 0; }
        .yacht-sail { position:absolute; bottom:20px; left:25px; width:0; height:0; border-left:25px solid transparent; border-right:10px solid transparent; border-bottom:50px solid white; }
        .glass-wall { position:absolute; top:0; left:0; right:0; bottom:30%; background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.15)); border-bottom:2px solid rgba(255,255,255,0.5); pointer-events:none; }
        .window-sill { position:absolute; bottom:30%; left:0; right:0; height:12px; background:#A0522D; border-top:2px solid #8B4513; z-index:5; }
        .flower-pot {
            position:absolute; bottom:calc(30% + 12px); left:5%;
            width:24px; height:26px; background:#CD853F; border-radius:0 0 8px 8px; border:2px solid #8B4513;
            z-index:6;
        }
        .flower-pot::after { content:'🌿'; position:absolute; top:-16px; left:2px; font-size:1rem; }
        .purple-bg {
            position:absolute; bottom:0; left:0; right:0; top:70%;
            background:purple;
            z-index:1;
        }
        .kitchen-area { position:absolute; bottom:18%; left:0; right:0; height:35%; z-index:2; }
        .table { position:absolute; top:50%; left:5%; right:5%; height:50%; background:linear-gradient(180deg, #DEB887, #A0522D); border-top:6px solid #8B4513; }
        .stove { position:absolute; top:20%; left:25%; right:25%; height:45%; background:linear-gradient(180deg, #F5F5F5, #D3D3D3); border-radius:15px 15px 5px 5px; border:3px solid #A9A9A9; }
        .pot {
            position:absolute; top:5%; left:50%; transform:translateX(-50%);
            width:55%; height:60%;
            background:linear-gradient(180deg, #C0C0C0, #708090);
            border-radius:0 0 25px 25px; border:3px solid #2F4F4F;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            z-index:3;
        }
        .pot::after { content:''; position:absolute; top:-10px; left:-3px; right:-3px; height:10px; background:#A9A9A9; border-radius:5px; }
        .steam { position:absolute; top:-18px; left:50%; transform:translateX(-50%); width:70%; height:18px; }
        .steam-particle { position:absolute; width:10px; height:10px; background:rgba(255,255,255,0.7); border-radius:50%; animation:rise 2s infinite; }
        .steam-particle:nth-child(1){ left:20%; animation-delay:0s; }
        .steam-particle:nth-child(2){ left:50%; animation-delay:0.7s; }
        .steam-particle:nth-child(3){ left:70%; animation-delay:1.4s; }
        @keyframes rise { 0%{ transform:translateY(0) scale(1); opacity:0.7; } 100%{ transform:translateY(-20px) scale(1.5); opacity:0; } }
        .energy-on-pot {
            background:rgba(0,0,0,0.7); color:#FFD700; padding:2px 10px; border-radius:10px;
            font-size:0.75rem; font-weight:bold; z-index:4;
            margin-top:5px;
        }
        .pot .start-btn {
            background:linear-gradient(180deg, #FF6347, #DC143C);
            color:white; border:none; padding:8px 18px;
            border-radius:15px; font-weight:bold; font-size:0.9rem;
            cursor:pointer; z-index:4; margin-top:4px;
        }
        .pot .start-btn:disabled { background:#808080; cursor:not-allowed; }
        .board {
            position:absolute; bottom:8%; left:50%; transform:translateX(-50%);
            width:88%; background:#DEB887; border-radius:10px;
            border:3px solid #8B4513; display:flex; flex-direction:column;
            padding:8px; gap:8px; z-index:10;
        }
        .row { display:flex; justify-content:space-around; }
        .hole {
            background:radial-gradient(circle, #2F1B0E, #1A0F07);
            border-radius:50%; border:2px solid #3D2B1F;
            display:flex; justify-content:center; align-items:center;
            cursor:pointer; position:relative; transition:transform 0.1s;
            width:55px; height:55px;
        }
        .hole:active { transform:scale(0.85); }
        .veg { font-size:1.8rem; pointer-events:none; animation:popIn 0.3s ease-out; }
        @keyframes popIn { 0%{ transform:scale(0); } 80%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
        .rotten { filter:brightness(0.7) sepia(0.5) hue-rotate(-15deg); }
        .rotten::after { content:'🪱'; position:absolute; top:-6px; right:-6px; font-size:0.6rem; }
        .top-left-buttons {
            position:absolute; top:5px; left:5px; display:flex; gap:4px; z-index:35; flex-wrap:wrap;
        }
        .top-left-buttons .item {
            background:rgba(0,0,0,0.65); color:white; padding:3px 8px; border-radius:12px;
            font-size:0.65rem; display:flex; align-items:center; gap:3px; cursor:pointer;
        }
        .balances {
            position:absolute; top:5px; right:5px; display:flex; flex-direction:column; align-items:flex-end; gap:3px; z-index:35;
        }
        .balances div {
            background:rgba(0,0,0,0.75); color:white; padding:3px 10px; border-radius:12px;
            font-size:0.7rem; font-weight:bold;
        }
        .bottom-panel { position:absolute; bottom:2px; left:2px; right:2px; display:flex; justify-content:space-around; z-index:30; }
        .nav-btn {
            background:rgba(0,0,0,0.75); color:white; border:none; padding:10px 6px; border-radius:10px;
            font-size:0.75rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
            flex:1; margin:2px; font-weight:bold; letter-spacing:0.5px;
        }
        .nav-btn.active { background:rgba(255,215,0,0.8); color:black; }
        .screen { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); color:white; padding:20px; flex-direction:column; align-items:center; justify-content:center; z-index:40; overflow-y:auto; }
        .screen.active { display:flex; }
        .back-btn { position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.3); color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; }
        .flying-veg {
            position:absolute; z-index:20; pointer-events:none;
            animation: flyToPot 0.5s ease-in forwards;
        }
        @keyframes flyToPot {
            0% { transform: translate(0, 0) scale(1); opacity:1; }
            50% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity:1; }
            100% { transform: translate(var(--ex), var(--ey)) scale(0.5); opacity:0; }
        }
        .coin-fountain {
            position:absolute;
            pointer-events:none;
            animation: coinUp 1s ease-out forwards;
            z-index:25;
        }
        @keyframes coinUp {
            0% { transform:translateY(0) scale(1); opacity:1; }
            100% { transform:translateY(-60px) scale(0.3); opacity:0; }
        }
        .task-item {
            background:rgba(255,255,255,0.1); padding:10px; margin:8px 0; border-radius:8px;
            display:flex; flex-direction:column; gap:8px;
        }
        .task-item input {
            padding:8px; border-radius:5px; border:none; width:100%;
        }
        .task-item button {
            padding:8px 12px; border:none; border-radius:5px; font-weight:bold;
            background:#FFD700; color:black;
        }
    </style>
</head>
<body>
<div id="game-container">
    <!-- Фон -->
    <div class="sky"></div>
    <div class="horizon"></div>
    <div class="sea"></div>
    <div class="yacht">
        <div class="yacht-sail"></div>
        <div class="yacht-body"></div>
    </div>
    <div class="glass-wall"></div>
    <div class="window-sill"></div>
    <div class="flower-pot"></div>
    <div class="purple-bg"></div>

    <!-- Кухня -->
    <div class="kitchen-area">
        <div class="table"></div>
        <div class="stove">
            <div class="pot" id="pot">
                <div class="steam">
                    <div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div>
                </div>
                <div class="energy-on-pot" id="energy-on-pot">⚡ 60/60</div>
                <button class="start-btn" id="start-btn">🥘 НАЧАТЬ</button>
            </div>
        </div>
    </div>

    <!-- Доска (5+4) -->
    <div class="board" id="board">
        <div class="row">
            <div class="hole" data-hole="0"></div>
            <div class="hole" data-hole="1"></div>
            <div class="hole" data-hole="2"></div>
            <div class="hole" data-hole="3"></div>
            <div class="hole" data-hole="4"></div>
        </div>
        <div class="row">
            <div class="hole" data-hole="5"></div>
            <div class="hole" data-hole="6"></div>
            <div class="hole" data-hole="7"></div>
            <div class="hole" data-hole="8"></div>
        </div>
    </div>

    <!-- Верхние иконки -->
    <div class="top-left-buttons">
        <div class="item" id="top-tappers">🏆 Топ</div>
        <div class="item" id="top-miners">⛏️ Майнеры</div>
        <div class="item" id="referral-icon">👥</div>
        <div class="item" id="about-icon">📖 О проекте</div>
    </div>

    <!-- Балансы -->
    <div class="balances">
        <div id="rum-balance">💰 RUM: 0</div>
        <div id="invest-balance">📈 Инвест: 0</div>
        <div id="srum-balance">💎 SRUM: 0.00</div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
        <button class="nav-btn" data-screen="arena">🏟️<br>Арена</button>
        <button class="nav-btn" data-screen="mining-club">🐺<br>Клуб</button>
        <button class="nav-btn" data-screen="tasks">📋<br>Задания</button>
        <button class="nav-btn" data-screen="invest">📈<br>Инвест</button>
        <button class="nav-btn" data-screen="wallet">👛<br>Кошелёк</button>
        <button class="nav-btn" data-screen="shop">🛍️<br>Магазин</button>
    </div>

    <!-- Экраны-заглушки -->
    <div class="screen" id="arena-screen"><button class="back-btn">← Назад</button>🏟️ Арена (турниры)</div>
    <div class="screen" id="mining-club-screen"><button class="back-btn">← Назад</button>🐺 Майнинг клуб «Голодные волки»</div>
    <div class="screen" id="tasks-screen">
        <button class="back-btn">← Назад</button>
        <h2>📋 Задания</h2>
        <div style="display:flex; gap:10px; margin:15px 0;">
            <button id="tasks-available-btn" style="padding:8px 16px; background:#FFD700; border:none; border-radius:8px; color:black; font-weight:bold;">Доступные</button>
            <button id="tasks-create-btn" style="padding:8px 16px; background:#4CAF50; border:none; border-radius:8px;">Создать</button>
            <button id="tasks-my-btn" style="padding:8px 16px; background:#2196F3; border:none; border-radius:8px;">Мои</button>
        </div>
        <div id="tasks-content" style="width:100%; max-height:60%; overflow-y:auto;"></div>
    </div>
    <div class="screen" id="invest-screen"><button class="back-btn">← Назад</button>📈 Инвестиции</div>
    <div class="screen" id="wallet-screen"><button class="back-btn">← Назад</button>👛 Кошелёк</div>
    <div class="screen" id="shop-screen"><button class="back-btn">← Назад</button>🛍️ Магазин</div>
    <div class="screen" id="top-tappers-screen"><button class="back-btn">← Назад</button>🏆 Топ игроков</div>
    <div class="screen" id="top-miners-screen"><button class="back-btn">← Назад</button>⛏️ Топ майнеров</div>
    <div class="screen" id="referral-screen"><button class="back-btn">← Назад</button>👥 Рефералы</div>
    <div class="screen" id="about-screen"><button class="back-btn">← Назад</button>📖 О проекте и дорожная карта</div>
</div>

<script>
(function() {
    const GOOD = ['🥬','🧅','🥔','🥕','🫑','🌿','🫘','🧄','🍅'];
    const BAD = ['💩','🪱','🧀','🥀','🍄'];

    // --- СОСТОЯНИЕ ---
    let rum = parseInt(localStorage.getItem('rum') || '0');
    let invest = parseInt(localStorage.getItem('invest') || '0');
    let srum = parseFloat(localStorage.getItem('srum') || '0');
    let energy = parseInt(localStorage.getItem('energy') || '60');
    const maxEnergy = 60;
    let gameActive = false, gameTimer = null, gameTimeLeft = 60;
    let spawnInterval = null, currentVeg = {};

    // Задания
    let officialTasks = JSON.parse(localStorage.getItem('officialTasks')) || [
        { id:1, desc:'Подписаться на канал', reward:50, link:'', completed:false },
        { id:2, desc:'Сделать репост', reward:100, link:'', completed:false },
        { id:3, desc:'Пригласить друга', reward:200, link:'', completed:false },
        { id:4, desc:'Сыграть 5 раундов', reward:300, link:'', completed:false }
    ];
    let userTasks = JSON.parse(localStorage.getItem('userTasks')) || [];

    function saveState() {
        localStorage.setItem('rum', rum);
        localStorage.setItem('invest', invest);
        localStorage.setItem('srum', srum);
        localStorage.setItem('energy', energy);
        localStorage.setItem('officialTasks', JSON.stringify(officialTasks));
        localStorage.setItem('userTasks', JSON.stringify(userTasks));
    }

    const pot = document.getElementById('pot');
    const board = document.getElementById('board');
    const rumBal = document.getElementById('rum-balance');
    const investBal = document.getElementById('invest-balance');
    const srumBal = document.getElementById('srum-balance');
    const energyOnPot = document.getElementById('energy-on-pot');
    const startBtn = document.getElementById('start-btn');
    const holes = document.querySelectorAll('.hole');
    const tasksContent = document.getElementById('tasks-content');
    const tasksAvailableBtn = document.getElementById('tasks-available-btn');
    const tasksCreateBtn = document.getElementById('tasks-create-btn');
    const tasksMyBtn = document.getElementById('tasks-my-btn');

    function updateUI() {
        rumBal.textContent = `💰 RUM: ${rum}`;
        investBal.textContent = `📈 Инвест: ${invest}`;
        srumBal.textContent = `💎 SRUM: ${srum.toFixed(2)}`;
        energyOnPot.textContent = `⚡ ${energy}/${maxEnergy}`;
        if (energy === maxEnergy && !gameActive) {
            startBtn.disabled = false; startBtn.textContent = '🥘 НАЧАТЬ'; startBtn.style.display = 'block';
        } else if (gameActive) {
            startBtn.style.display = 'none';
        } else {
            startBtn.disabled = true;
            startBtn.textContent = `⏳ ${Math.ceil((maxEnergy-energy)*6/60)} мин`;
            startBtn.style.display = 'block';
        }
        saveState();
    }

    function spawnAll() {
        holes.forEach(h => h.innerHTML = '');
        currentVeg = {};
        const holeElements = [...holes];
        for (let i = 0; i < holeElements.length; i++) {
            const isBad = Math.random() < 0.25;
            const pool = isBad ? BAD : GOOD;
            const emoji = pool[Math.floor(Math.random() * pool.length)];
            const el = document.createElement('span');
            el.className = 'veg' + (isBad ? ' rotten' : '');
            el.textContent = emoji;
            holeElements[i].appendChild(el);
            currentVeg[i] = { type: isBad ? 'bad' : 'good', emoji };
        }
    }

    function showCoinFountain() {
        const potRect = pot.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const centerX = potRect.left + potRect.width/2 - containerRect.left;
        const centerY = potRect.top - containerRect.top;

        for (let i=0; i<7; i++) {
            const coin = document.createElement('div');
            coin.className = 'coin-fountain';
            coin.textContent = '💰';
            coin.style.left = (centerX + (Math.random()-0.5)*40) + 'px';
            coin.style.top = (centerY + (Math.random()-0.5)*10) + 'px';
            coin.style.animationDuration = (0.8 + Math.random()*0.5) + 's';
            document.getElementById('game-container').appendChild(coin);
            coin.addEventListener('animationend', () => coin.remove());
        }
    }

    function processHit(hole, touch) {
        if (!gameActive) return;
        const num = [...holes].indexOf(hole);
        if (num === -1 || !currentVeg[num]) {
            // промах по пустой лунке
            rum = Math.max(0, rum-5);
            updateUI();
            return;
        }

        const vegData = currentVeg[num];
        if (vegData.type === 'good') {
            rum += 10;
            flyVegToPot(hole, vegData.emoji);
            showCoinFountain();
            showEffect(touch.clientX, touch.clientY, '+10', 'gold');
        } else {
            rum = Math.max(0, rum-5);
            showEffect(touch.clientX, touch.clientY, '✖', 'red');
        }
        delete currentVeg[num];
        hole.innerHTML = '';
        updateUI();
    }

    function handleTouchStart(e) {
        e.preventDefault();
        if (!gameActive) return;

        const touches = e.changedTouches;
        for (let i=0; i<touches.length; i++) {
            const touch = touches[i];
            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const hole = target ? target.closest('.hole') : null;
            if (hole) {
                processHit(hole, touch);
            } else {
                // палец не по доске — штраф
                rum = Math.max(0, rum-5);
                updateUI();
            }
        }
    }

    function flyVegToPot(hole, emoji) {
        const holeRect = hole.getBoundingClientRect();
        const potRect = pot.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const startX = holeRect.left + holeRect.width/2 - containerRect.left;
        const startY = holeRect.top + holeRect.height/2 - containerRect.top;
        const endX = potRect.left + potRect.width/2 - containerRect.left;
        const endY = potRect.top + potRect.height*0.3 - containerRect.top;
        const vegEl = document.createElement('div');
        vegEl.className = 'flying-veg';
        vegEl.textContent = emoji;
        vegEl.style.left = startX + 'px';
        vegEl.style.top = startY + 'px';
        vegEl.style.setProperty('--dx', (endX - startX) / 2 + 'px');
        vegEl.style.setProperty('--dy', -50 + 'px');
        vegEl.style.setProperty('--ex', (endX - startX) + 'px');
        vegEl.style.setProperty('--ey', (endY - startY) + 'px');
        document.getElementById('game-container').appendChild(vegEl);
        vegEl.addEventListener('animationend', () => vegEl.remove());
    }

    function showEffect(clientX, clientY, text, color) {
        const el = document.createElement('div');
        el.style.cssText = `position:absolute; pointer-events:none; color:${color}; font-weight:bold; z-index:100; animation:fly 1s ease-out forwards;`;
        el.textContent = text;
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        el.style.left = (clientX - containerRect.left) + 'px';
        el.style.top = (clientY - containerRect.top) + 'px';
        document.getElementById('game-container').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    function startGame() {
        if (energy < maxEnergy || gameActive) return;
        gameActive = true; gameTimeLeft = 60; energy = maxEnergy;
        updateUI();
        spawnAll();
        let interval = 1800;
        spawnInterval = setInterval(() => {
            if (!gameActive) return;
            spawnAll();
            interval = Math.max(450, interval-80);
            clearInterval(spawnInterval);
            spawnInterval = setInterval(() => { if (gameActive) spawnAll(); }, interval);
        }, interval);
        gameTimer = setInterval(() => {
            gameTimeLeft--; energy--;
            updateUI();
            if (gameTimeLeft <= 0) endGame();
        }, 1000);
    }

    function endGame() {
        gameActive = false;
        clearInterval(gameTimer); clearInterval(spawnInterval);
        holes.forEach(h => h.innerHTML = '');
        currentVeg = {};
        startBtn.style.display = 'block';
        updateUI();
        startRecovery();
    }

    function startRecovery() {
        const int = setInterval(() => {
            if (gameActive || energy >= maxEnergy) { if (energy >= maxEnergy) clearInterval(int); return; }
            energy = Math.min(maxEnergy, energy+1);
            updateUI();
            if (energy >= maxEnergy) clearInterval(int);
        }, 6000);
    }

    // --- ЗАДАНИЯ ---
    function renderAvailableTasks() {
        let html = '';
        officialTasks.forEach((task, index) => {
            const disabled = task.completed ? 'disabled' : '';
            html += `<div class="task-item">
                <span>${task.desc} (+${task.reward} RUM)</span>
                <input type="url" placeholder="Вставь ссылку" value="${task.link || ''}" data-task-id="${task.id}" ${disabled}>
                <button data-task-id="${task.id}" class="complete-task-btn" ${disabled}>Я выполнил</button>
            </div>`;
        });
        tasksContent.innerHTML = html;

        // Обработка ввода ссылки
        document.querySelectorAll('.task-item input').forEach(input => {
            input.addEventListener('input', (e) => {
                const taskId = parseInt(e.target.dataset.taskId);
                const task = officialTasks.find(t => t.id === taskId);
                if (task) {
                    task.link = e.target.value;
                    saveState();
                }
            });
        });

        // Кнопка "Я выполнил"
        document.querySelectorAll('.complete-task-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const taskId = parseInt(e.target.dataset.taskId);
                const task = officialTasks.find(t => t.id === taskId);
                if (task && !task.completed) {
                    task.completed = true;
                    rum += task.reward;
                    updateUI();
                    renderAvailableTasks();
                }
            });
        });
    }

    function renderCreateTask() {
        tasksContent.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:10px;">
                <input id="task-desc" placeholder="Описание задания" style="padding:10px; border-radius:8px; border:none;">
                <input id="task-reward" type="number" placeholder="Награда RUM" style="padding:10px; border-radius:8px; border:none;">
                <button id="publish-task-btn" style="padding:10px; background:#4CAF50; border:none; border-radius:8px; color:white; font-weight:bold;">Опубликовать</button>
            </div>
        `;
        document.getElementById('publish-task-btn').addEventListener('click', () => {
            const desc = document.getElementById('task-desc').value.trim();
            const reward = parseInt(document.getElementById('task-reward').value);
            if (desc && reward > 0 && rum >= reward) {
                rum -= reward;
                const newTask = { id: Date.now(), desc, reward, author: 'Ты', completed: false, link:'' };
                userTasks.push(newTask);
                updateUI();
                renderCreateTask();
                alert('Задание опубликовано!');
            } else {
                alert('Недостаточно RUM или неверные данные');
            }
        });
    }

    function renderMyTasks() {
        let html = '<h3>Выполненные официальные</h3>';
        officialTasks.filter(t => t.completed).forEach(t => html += `<div>✅ ${t.desc} (+${t.reward})</div>`);
        html += '<h3>Созданные мной</h3>';
        userTasks.forEach(t => html += `<div>📌 ${t.desc} (${t.reward} RUM)</div>`);
        tasksContent.innerHTML = html;
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if (screenId === 'tasks') {
            document.getElementById('tasks-screen').classList.add('active');
            renderAvailableTasks();
        } else if (screenId !== 'main') {
            const target = document.getElementById(screenId+'-screen');
            if (target) target.classList.add('active');
        }
    }

    // События
    board.addEventListener('touchstart', handleTouchStart, {passive: false});
    board.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
    startBtn.addEventListener('click', startGame);

    document.getElementById('top-tappers').addEventListener('click', ()=> switchScreen('top-tappers'));
    document.getElementById('top-miners').addEventListener('click', ()=> switchScreen('top-miners'));
    document.getElementById('referral-icon').addEventListener('click', ()=> switchScreen('referral'));
    document.getElementById('about-icon').addEventListener('click', ()=> switchScreen('about'));

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const screen = e.currentTarget.dataset.screen;
            switchScreen(screen);
        });
    });

    document.querySelectorAll('.back-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        });
    });

    tasksAvailableBtn.addEventListener('click', renderAvailableTasks);
    tasksCreateBtn.addEventListener('click', renderCreateTask);
    tasksMyBtn.addEventListener('click', renderMyTasks);

    updateUI();
    startRecovery();
    document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
})();
</script>
</body>
</html>
