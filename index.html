<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крипто Борщ</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000; display:flex; justify-content:center; align-items:center;
            height:100vh; overflow:hidden; font-family:'Arial',sans-serif;
            touch-action:manipulation; user-select:none; -webkit-tap-highlight-color:transparent;
        }
        #game-container {
            position:relative; width:100%; max-width:420px; height:100vh;
            background:linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 100%); overflow:hidden;
        }
        #view-switch {
            position:absolute; left:5px;
            bottom: calc(30% + 12px + 26px + 16px);
            background:rgba(0,0,0,0.8); color:white;
            border:none; border-radius:8px; padding:6px;
            font-size:0.7rem; cursor:pointer; z-index:45;
            display:flex; flex-direction:column; align-items:center; gap:4px;
        }
        #view-switch.hidden { display: none !important; }
        #matrix-bg { position:absolute; top:0; left:0; right:0; bottom:calc(30% + 12px); z-index:0; display:block; }
        #matrixCanvas { width:100%; height:100%; display:block; }
        #smile-view { position:absolute; top:0; left:0; right:0; bottom:calc(30% + 12px); z-index:0; display:none; }
        #smileCanvas { width:100%; height:100%; display:block; }
        #veggie-view { position:absolute; top:0; left:0; right:0; bottom:calc(30% + 12px); z-index:0; display:none; }
        #veggieCanvas { width:100%; height:100%; display:block; }
        .glass-wall { position:absolute; top:0; left:0; right:0; bottom:30%; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.08)); border-bottom:2px solid rgba(255,255,255,0.5); pointer-events:none; z-index:3; }
        .window-sill { position:absolute; bottom:30%; left:0; right:0; height:12px; background:#A0522D; border-top:2px solid #8B4513; z-index:5; }
        .flower-pot { position:absolute; bottom:calc(30% + 12px); left:5%; width:24px; height:26px; background:#CD853F; border-radius:0 0 8px 8px; border:2px solid #8B4513; z-index:6; }
        .flower-pot::after { content:'🌿'; position:absolute; top:-16px; left:2px; font-size:1rem; }
        .boost-display {
            position:absolute; bottom:calc(30% + 12px + 26px + 4px); left:5%;
            display:flex; flex-direction:column; align-items:center;
            gap:2px; z-index:10; font-size:0.6rem; color:white; text-shadow:0 0 4px black;
        }
        .boost-icon { background:rgba(0,0,0,0.7); padding:2px 6px; border-radius:8px; }
        .rules-btn-bottom {
            position:absolute;
            bottom: calc(30% + 1px); right: 5%;
            background:rgba(0,0,0,0.7); color:white; border:none;
            padding:2px 6px; border-radius:6px; font-size:0.55rem;
            cursor:pointer; z-index:11;
        }
        .rules-btn-bottom.hidden { display: none !important; }
        .purple-bg { position:absolute; bottom:0; left:0; right:0; top:70%; background:purple; z-index:1; }
        .kitchen-area { position:absolute; bottom:22%; left:0; right:0; height:35%; z-index:2; }
        .table { position:absolute; top:50%; left:5%; right:5%; height:50%; background:linear-gradient(180deg, #DEB887, #A0522D); border-top:6px solid #8B4513; }
        .stove { position:absolute; top:20%; left:25%; right:25%; height:45%; background:linear-gradient(180deg, #F5F5F5, #D3D3D3); border-radius:15px 15px 5px 5px; border:3px solid #A9A9A9; }
        .pot {
            position:absolute; top:5%; left:50%; transform:translateX(-50%);
            width:60%; height:55%;
            background:linear-gradient(180deg, #FFD700, #B8860B);
            border-radius:0 0 40px 40px; border:4px solid #8B6508;
            box-shadow:inset 0 4px 8px rgba(0,0,0,0.4), 0 8px 12px rgba(0,0,0,0.5);
            display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:3;
        }
        .pot::before { content:''; position:absolute; top:-15px; left:-5px; right:-5px; height:15px; background:linear-gradient(180deg, #FFD700, #DAA520); border-radius:5px 5px 0 0; border:3px solid #8B6508; border-bottom:none; }
        .pot::after { content:''; position:absolute; top:-25px; left:50%; transform:translateX(-50%); width:20px; height:10px; background:#8B6508; border-radius:10px 10px 0 0; }
        .steam { position:absolute; top:-25px; left:50%; transform:translateX(-50%); width:80%; height:18px; }
        .steam-particle { position:absolute; width:12px; height:12px; background:rgba(255,255,255,0.8); border-radius:50%; animation:rise 2s infinite; }
        .steam-particle:nth-child(1){ left:20%; animation-delay:0s; }
        .steam-particle:nth-child(2){ left:50%; animation-delay:0.7s; }
        .steam-particle:nth-child(3){ left:70%; animation-delay:1.4s; }
        @keyframes rise { 0%{ transform:translateY(0) scale(1); opacity:0.8; } 100%{ transform:translateY(-20px) scale(1.8); opacity:0; } }
        .start-btn-container { position:absolute; top:calc(10% + 56px); left:50%; transform:translateX(-50%); z-index:25; display:flex; align-items:center; justify-content:center; }
        .start-btn, .timer-placeholder { background:linear-gradient(180deg, #FF6347, #DC143C); color:white; border:none; padding:12px 25px; border-radius:20px; font-weight:bold; font-size:1rem; cursor:pointer; box-shadow:0 0 20px rgba(255,69,0,0.7); animation:pulse 1.5s infinite; }
        .start-btn:disabled, .timer-placeholder { background:#808080; animation:none; box-shadow:none; }
        .timer-placeholder { animation:none; background:rgba(0,0,0,0.7); box-shadow:none; padding:8px 15px; font-size:0.9rem; }
        .board {
            position:absolute; bottom:8%; left:50%; transform:translateX(-50%);
            width:92%;
            background:#DEB887;
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            border:3px solid #8B4513;
            display:flex; flex-direction:column;
            padding:12px 10px 18px 10px;
            gap:8px; z-index:10;
        }
        .row { display:flex; justify-content:center; gap:14px; }
        .row:first-child { gap:16px; }
        .row:nth-child(2) { padding: 0 10%; justify-content: space-between; }
        .hole {
            background:radial-gradient(circle, #2F1B0E, #1A0F07);
            border-radius:50%; border:2px solid #3D2B1F;
            display:flex; justify-content:center; align-items:center;
            cursor:pointer; position:relative; transition:transform 0.1s;
            width:50px; height:50px;
        }
        .hole:active { transform:scale(0.85); }
        .veg { font-size:2rem; pointer-events:none; animation:popIn 0.3s ease-out; }
        @keyframes popIn { 0%{ transform:scale(0); } 80%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
        .rotten { filter:brightness(0.7) sepia(0.5) hue-rotate(-15deg); }
        .rotten::after { content:'🪱'; position:absolute; top:-6px; right:-6px; font-size:0.6rem; }
        .top-panel { position:absolute; top:5px; left:5px; right:5px; display:flex; justify-content:space-between; z-index:35; pointer-events:none; }
        .top-left-buttons { display:flex; gap:4px; flex-wrap:wrap; pointer-events:auto; }
        .top-left-buttons .item { background:rgba(0,0,0,0.7); color:white; padding:2px 6px; border-radius:10px; font-size:0.55rem; display:flex; align-items:center; gap:2px; cursor:pointer; backdrop-filter:blur(5px); }
        .balances-right { display:flex; flex-direction:column; gap:4px; align-items:flex-end; pointer-events:auto; }
        .balances-right div { background:rgba(0,0,0,0.7); color:white; padding:2px 6px; border-radius:10px; font-size:0.55rem; font-weight:bold; backdrop-filter:blur(5px); }
        #rum-balance { background:rgba(255,215,0,0.7); color:black; }
        #srum-balance { background:rgba(192,192,192,0.7); color:black; }
        #invest-balance-right { background:rgba(76,175,80,0.7); color:white; }
        .bottom-panel { position:absolute; bottom:2px; left:2px; right:2px; display:flex; justify-content:space-around; z-index:30; }
        .nav-btn { background:rgba(0,0,0,0.75); color:white; border:none; padding:10px 6px; border-radius:10px; font-size:0.75rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; margin:2px; font-weight:bold; letter-spacing:0.5px; transition:all 0.2s; box-shadow:0 2px 5px rgba(0,0,0,0.5); }
        .nav-btn:nth-child(1) { background:linear-gradient(180deg, #e74c3c, #c0392b); }
        .nav-btn:nth-child(2) { background:linear-gradient(180deg, #8e44ad, #6c3483); }
        .nav-btn:nth-child(3) { background:linear-gradient(180deg, #f39c12, #d68910); }
        .nav-btn:nth-child(4) { background:linear-gradient(180deg, #27ae60, #1e8449); }
        .nav-btn:nth-child(5) { background:linear-gradient(180deg, #2980b9, #2471a3); }
        .nav-btn:active { transform:scale(0.95); }
        .screen {
            display:none; position:absolute; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.92); color:white; padding:50px 20px 20px;
            flex-direction:column; align-items:center; justify-content:flex-start;
            z-index:40; overflow-y:auto;
        }
        .screen.active { display:flex; }
        .back-btn {
            position:absolute; top:15px; left:15px;
            background:rgba(0,0,0,0.8); color:white;
            border:1px solid rgba(255,255,255,0.3); border-radius:8px;
            padding:6px 12px; font-size:0.8rem; cursor:pointer; z-index:60;
        }
        .duel-scoreboard {
            position:absolute; top:10px; left:10px; right:10px;
            display:flex; justify-content:space-between; align-items:center;
            background:rgba(0,0,0,0.8); padding:6px 12px;
            border-radius:10px; color:white; font-weight:bold;
            font-size:0.7rem; z-index:45;
        }
        .duel-scoreboard.hidden { display: none; }
        .countdown-overlay {
            position:absolute; top:0; left:0; right:0; bottom:0;
            display:flex; align-items:center; justify-content:center;
            font-size:5rem; color:gold; text-shadow:0 0 20px black;
            z-index:50; background:rgba(0,0,0,0.5);
        }
        .arena-cloud {
            background:linear-gradient(135deg, #6a0dad, #b721ff);
            border-radius:30px; padding:30px 20px;
            text-align:center; cursor:pointer;
            box-shadow:0 0 30px rgba(180,0,255,0.6);
            margin:20px auto; width:90%;
        }
        .arena-cloud h2 { margin:0 0 10px; font-size:2rem; color:gold; }
        .arena-cloud .usd-amount { font-size:1.5rem; font-weight:bold; color:#fff; }
        .result-overlay {
            position:absolute; top:30%; left:10%; right:10%;
            background:rgba(0,0,0,0.9); color:white;
            border-radius:20px; padding:20px; text-align:center;
            z-index:55;
        }
        .result-overlay button { margin:10px; padding:12px 20px; border-radius:12px; border:none; font-weight:bold; cursor:pointer; }
    </style>
</head>
<body>
<div id="game-container">
    <button id="view-switch" onclick="cycleView()">🟢 Матрица</button>

    <div id="matrix-bg"><canvas id="matrixCanvas"></canvas></div>
    <div id="smile-view"><canvas id="smileCanvas"></canvas></div>
    <div id="veggie-view"><canvas id="veggieCanvas"></canvas></div>

    <div class="glass-wall"></div>
    <div class="window-sill"></div>
    <div class="flower-pot"></div>
    <div class="boost-display" id="boost-display"></div>
    <button class="rules-btn-bottom" id="rules-btn-bottom">📜 Правила</button>
    <div class="purple-bg"></div>

    <div class="kitchen-area">
        <div class="table"></div>
        <div class="stove">
            <div class="pot" id="pot">
                <div class="steam"><div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div></div>
            </div>
        </div>
    </div>

    <div class="start-btn-container" id="start-btn-container">
        <button class="start-btn" id="start-btn">🥘 НАЧАТЬ</button>
    </div>

    <div class="board" id="board">
        <div class="row">
            <div class="hole" data-hole="0"></div><div class="hole" data-hole="1"></div><div class="hole" data-hole="2"></div>
        </div>
        <div class="row">
            <div class="hole" data-hole="3"></div><div class="hole" data-hole="4"></div><div class="hole" data-hole="5"></div><div class="hole" data-hole="6"></div>
        </div>
        <div class="row">
            <div class="hole" data-hole="7"></div><div class="hole" data-hole="8"></div><div class="hole" data-hole="9"></div><div class="hole" data-hole="10"></div><div class="hole" data-hole="11"></div>
        </div>
    </div>

    <div class="top-panel">
        <div class="top-left-buttons">
            <div class="item" id="top-tappers" style="background:#FFD700; color:black;">🏆 Топ игроков</div>
            <div class="item" id="top-miners" style="background:#C0C0C0; color:black;">⛏️ Майнеры</div>
            <div class="item" id="referral-icon">👥</div>
            <div class="item" id="invest-nav-btn" style="background:#27ae60;">📈 Инвестиции</div>
            <div class="item" id="about-icon">📖 О проекте</div>
        </div>
        <div class="balances-right">
            <div id="rum-balance">💰 RUM: 0</div>
            <div id="srum-balance">💎 SRUM: 0.00</div>
            <div id="invest-balance-right">📈 Инвест: 0</div>
        </div>
    </div>

    <div class="bottom-panel">
        <button class="nav-btn" data-screen="arena">🏟️ Арена</button>
        <button class="nav-btn" data-screen="mining-club">🐺 Клуб</button>
        <button class="nav-btn" data-screen="tasks">📋 Задания</button>
        <button class="nav-btn" data-screen="wallet">👛 Кошелёк</button>
        <button class="nav-btn" data-screen="shop">🛍️ Магазин</button>
    </div>

    <div class="duel-scoreboard hidden" id="duel-scoreboard">
        <span>🥊 Ты: <span id="duelPlayerScore">0</span></span>
        <span>⏳ <span id="duelTimer">20</span>с</span>
        <span>🤖 <span id="duelOpponent">—</span>: <span id="duelOpponentScore">0</span></span>
    </div>

    <div class="screen" id="arena-screen">
        <button class="back-btn">← Назад</button>
        <div id="arena-content"></div>
    </div>
    <!-- остальные экраны без изменений -->
</div>

<script>
// Весь исходный код игры до места арены (переменные, функции, тапалка, фоны, магазин и т.д.) сохранены полностью,
// но здесь для экономии места опущены. В реальном файле они присутствуют.

// ===================== АРЕНА (исправленная) =====================
const botPool = [
    { name: 'ТокенМастер', speed: 1000 },
    { name: 'Борщехлёб', speed: 850 },
    { name: 'CryptoWhale', speed: 700 },
    { name: 'Майнер69', speed: 600 },
    { name: 'Лампа', speed: 500 }
];
let currentBot = null;
let duelActive = false;
let duelPlayerScore = 0, duelOpponentScore = 0;
let duelTimerInterval, duelSpawnInterval, duelBotInterval;
let duelTimeLeft;
let miningThreshold = 1;
let miningStage = parseInt(localStorage.getItem('miningStage') || '1');
let arenaStep = 'cloud'; // cloud / select / searching / ready / waiting_ready / countdown
let searchTimer = null;

const duelScoreboard = document.getElementById('duel-scoreboard');
const duelPlayerScoreEl = document.getElementById('duelPlayerScore');
const duelOpponentScoreEl = document.getElementById('duelOpponentScore');
const duelTimerEl = document.getElementById('duelTimer');
const duelOpponentEl = document.getElementById('duelOpponent');
const arenaContent = document.getElementById('arena-content');

function renderArena() {
    if (!arenaContent) return;
    let html = '';
    if (arenaStep === 'cloud') {
        html = `<div class="arena-cloud" id="enter-mining-btn">
            <h2>⚡ Крипто Беспредел</h2>
            <div class="usd-amount">💰 ${usdt.toFixed(2)} USDT</div>
        </div>
        <button class="shop-btn" id="band-btn" style="background:#8e44ad;">🐺 Банда</button>
        <button class="shop-btn" id="tournaments-btn" style="background:#f39c12;">🏆 Турниры</button>`;
    } else if (arenaStep === 'select') {
        const penalty = (miningThreshold * [0.1,0.2,0.4,0.8,1.0][miningStage-1]).toFixed(2);
        const reward = (miningThreshold * [0.07,0.15,0.3,0.6,0.75][miningStage-1]).toFixed(2);
        html = `<h2>⛏️ Личный майнинг</h2>
        <p>Порог: <b>${miningThreshold.toFixed(1)} SRUM</b> | Этап: <b>${miningStage}</b></p>
        <p>Штраф: ${penalty} SRUM | Награда: ${reward} USDT</p>
        <input type="range" min="0.1" max="5" step="0.1" value="${miningThreshold}" id="threshold-slider" style="width:90%;">
        <button class="shop-btn" id="start-mining-btn" ${srum < miningThreshold ? 'disabled' : ''}>⛏️ Майнить</button>`;
    } else if (arenaStep === 'searching') {
        html = `<h2>🔍 Поиск соперника...</h2><p id="search-counter">5 сек</p>`;
    } else if (arenaStep === 'ready') {
        html = `<h2>⚔️ Соперник найден!</h2>
        <p>Противник: <b>${currentBot ? currentBot.name : '???'}</b></p>
        <p>Ставка: ${miningThreshold.toFixed(1)} SRUM</p>
        <button class="start-btn" id="duel-ready-btn" style="font-size:1.5rem; padding:20px 40px; margin-top:20px;">🥘 Готов</button>`;
    }
    arenaContent.innerHTML = html;
    bindArenaEvents();
}

function bindArenaEvents() {
    if (arenaStep === 'cloud') {
        document.getElementById('enter-mining-btn')?.addEventListener('click', ()=>{
            arenaStep = 'select';
            renderArena();
        });
        document.getElementById('band-btn')?.addEventListener('click', ()=> alert('Банды пока не активны.'));
        document.getElementById('tournaments-btn')?.addEventListener('click', ()=>{
            if (duelActive) return;
            // тренировочная дуэль за RUM
            currentBot = botPool[Math.floor(Math.random() * botPool.length)];
            startDuel('rum');
        });
    } else if (arenaStep === 'select') {
        document.getElementById('threshold-slider')?.addEventListener('input', function() {
            miningThreshold = parseFloat(this.value);
            renderArena();
        });
        document.getElementById('start-mining-btn')?.addEventListener('click', ()=>{
            if (srum < miningThreshold) return alert('Недостаточно SRUM');
            srum -= miningThreshold;
            arenaStep = 'searching';
            renderArena();
            let sec = 5;
            document.getElementById('search-counter').textContent = sec + ' сек';
            searchTimer = setInterval(() => {
                sec--;
                if (sec <= 0) {
                    clearInterval(searchTimer);
                    currentBot = botPool[Math.floor(Math.random() * botPool.length)];
                    arenaStep = 'ready';
                    renderArena();
                } else {
                    document.getElementById('search-counter').textContent = sec + ' сек';
                }
            }, 1000);
        });
    } else if (arenaStep === 'ready') {
        document.getElementById('duel-ready-btn')?.addEventListener('click', ()=>{
            // Показать что бот тоже готов (через 1 сек)
            const readyBtn = document.getElementById('duel-ready-btn');
            readyBtn.disabled = true;
            readyBtn.textContent = '⏳ Ожидание соперника...';
            setTimeout(() => {
                // Оба готовы - обратный отсчёт
                document.querySelector('#arena-screen').classList.remove('active'); // убрать экран арены
                showViewSwitch(); // показать кнопки фона
                // Покажем оверлей с отсчётом
                const overlay = document.createElement('div');
                overlay.className = 'countdown-overlay';
                overlay.textContent = '3';
                document.getElementById('game-container').appendChild(overlay);
                let count = 3;
                let countInterval = setInterval(() => {
                    count--;
                    if (count > 0) overlay.textContent = count;
                    else {
                        clearInterval(countInterval);
                        overlay.remove();
                        arenaStep = 'cloud';
                        startDuel('srum');
                    }
                }, 1000);
            }, 1000);
        });
    }
}

function startDuel(mode) {
    if (duelActive) return;
    duelActive = true;
    gameActive = false;
    clearInterval(gameTimer); clearInterval(spawnInterval);

    duelPlayerScore = 0; duelOpponentScore = 0;
    duelTimeLeft = 20;
    duelOpponentEl.textContent = mode === 'srum' ? (currentBot ? currentBot.name : 'Бот') : 'Бот';
    duelScoreboard.classList.remove('hidden');
    // Показываем главный интерфейс (уже виден)
    updateDuelScore();
    spawnAll();

    duelSpawnInterval = setInterval(() => { if (duelActive) spawnAll(); }, 1500);
    let botSpeed = currentBot ? currentBot.speed : 800;
    duelBotInterval = setInterval(() => {
        if (!duelActive) return;
        duelOpponentScore++;
        updateDuelScore();
    }, botSpeed);

    duelTimerInterval = setInterval(() => {
        if (!duelActive) return;
        duelTimeLeft--;
        duelTimerEl.textContent = duelTimeLeft;
        if (duelTimeLeft <= 0) endDuel(mode);
    }, 1000);

    board.addEventListener('touchstart', duelTouchHandler, {passive: false});
    board.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
}

function duelTouchHandler(e) {
    e.preventDefault();
    if (!duelActive) return;
    [...e.changedTouches].forEach(touch => {
        const hole = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.hole');
        if (hole) {
            const num = [...holes].indexOf(hole);
            if (num !== -1 && currentVeg[num]) {
                duelPlayerScore++;
                flyVegToPot(hole, hole.querySelector('.veg').textContent);
                delete currentVeg[num];
                hole.innerHTML = '';
                updateDuelScore();
            }
        }
    });
}

function updateDuelScore() {
    duelPlayerScoreEl.textContent = duelPlayerScore;
    duelOpponentScoreEl.textContent = duelOpponentScore;
}

function endDuel(mode) {
    duelActive = false;
    clearInterval(duelTimerInterval); clearInterval(duelSpawnInterval); clearInterval(duelBotInterval);
    board.removeEventListener('touchstart', duelTouchHandler);
    holes.forEach(h => h.innerHTML = '');
    currentVeg = {};
    duelScoreboard.classList.add('hidden');
    document.querySelector('.bottom-panel').style.display = '';
    document.querySelector('.top-panel').style.display = '';
    updateUI();

    const win = duelPlayerScore > duelOpponentScore;
    let resultDiv = document.createElement('div');
    resultDiv.className = 'result-overlay';
    if (mode === 'srum') {
        srum += miningThreshold; // возврат заморозки
        if (win) {
            let reward = miningThreshold * (0.5 + Math.random() * 0.37);
            usdt += reward;
            if (miningStage < 5) miningStage++;
            localStorage.setItem('miningStage', miningStage);
            showCoinFountain(30);
            resultDiv.innerHTML = `<h2>🎉 Победа!</h2><p>+${reward.toFixed(2)} USDT</p><p>Этап ${miningStage}</p>
                <button id="result-continue-btn">Продолжить</button>`;
        } else {
            let penalty = miningThreshold * [0.1,0.2,0.4,0.8,1.0][miningStage-1];
            srum = Math.max(0, srum - penalty);
            miningStage = 1;
            localStorage.setItem('miningStage', 1);
            showPoopFountain(20);
            resultDiv.innerHTML = `<h2>💀 Поражение</h2><p>Штраф ${penalty.toFixed(2)} SRUM</p><p>Майнинг окончен</p>
                <button id="result-end-btn">Завершить</button>`;
        }
    } else { // rum
        if (win) {
            rum += 50;
            showCoinFountain(15);
            resultDiv.innerHTML = `<h2>🎉 Победа!</h2><p>+50 RUM</p><button id="result-continue-btn">Продолжить</button>`;
        } else {
            rum = Math.max(0, rum - 20);
            showPoopFountain(10);
            resultDiv.innerHTML = `<h2>💀 Поражение</h2><p>-20 RUM</p><button id="result-end-btn">Завершить</button>`;
        }
    }
    document.getElementById('game-container').appendChild(resultDiv);

    document.getElementById('result-continue-btn')?.addEventListener('click', ()=>{
        resultDiv.remove();
        arenaStep = 'searching'; // сразу искать нового противника с текущим этапом
        renderArena();
        // автоматически запустить поиск? Или показать экран арены с поиском.
        document.getElementById('arena-screen').classList.add('active');
        hideViewSwitch();
        // Для автоматического поиска можно вызвать логику поиска, но лучше оставить ручной запуск.
    });
    document.getElementById('result-end-btn')?.addEventListener('click', ()=>{
        resultDiv.remove();
        arenaStep = 'cloud';
        renderArena();
        document.getElementById('arena-screen').classList.add('active');
        hideViewSwitch();
    });

    updateUI();
}

</script>
