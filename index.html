<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Крипто Борщ</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000;
            display:flex; justify-content:center; align-items:center;
            height:100vh; overflow:hidden;
            font-family:'Arial',sans-serif;
            touch-action:manipulation; user-select:none;
            -webkit-tap-highlight-color:transparent;
        }
        #game-container {
            position:relative; width:100%; max-width:420px; height:100vh;
            background:linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow:hidden;
        }
        /* Терминал – теперь от кнопок до кастрюли */
        #terminal {
            position:absolute; top:35px; left:0; right:0; bottom:47%; /* верх кастрюли */
            background:#0b0e14; display:flex; flex-direction:column;
            padding-top:5px; /* чтобы тикер не прилипал */
        }
        .ticker-bar {
            display:flex; justify-content:space-between; align-items:center;
            padding: 2px 6px; background:#111; color:white;
            font-size:0.6rem; font-weight:bold; gap:4px;
            flex-wrap:wrap; min-height:24px;
        }
        .ticker-left { display:flex; gap:4px; flex-wrap:wrap; }
        .ticker-item {
            display:flex; align-items:center; gap:3px;
            background:#1a1e27; padding:2px 5px; border-radius:3px; white-space:nowrap;
        }
        .ticker-item .sym { color:#FFD700; }
        .ticker-item .change.positive { color:#4CAF50; }
        .ticker-item .change.negative { color:#F44336; }
        .coin-tabs {
            display:flex; gap:3px; flex-shrink:0;
        }
        .coin-tab {
            padding:2px 6px; border:none; background:#1a1e27;
            color:#ccc; border-radius:4px; font-size:0.55rem; cursor:pointer;
        }
        .coin-tab.active { background:#FFD700; color:black; font-weight:bold; }
        #chart-container { flex:1; display:flex; position:relative; }
        #chartCanvas { flex:1; display:block; }
        .order-book {
            width:120px; background:rgba(255,255,255,0.03); font-size:0.55rem;
            display:flex; flex-direction:column; padding:4px; gap:2px;
            color:white; border-left:1px solid #333;
        }
        .order-row { display:flex; justify-content:space-between; }
        .ask { color:#F44336; }
        .bid { color:#4CAF50; }
        /* Остальной интерфейс без изменений */
        .glass-wall { position:absolute; top:0; left:0; right:0; bottom:30%; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.08)); border-bottom:2px solid rgba(255,255,255,0.5); pointer-events:none; z-index:3; }
        .window-sill { position:absolute; bottom:30%; left:0; right:0; height:12px; background:#A0522D; border-top:2px solid #8B4513; z-index:5; }
        .flower-pot { position:absolute; bottom:calc(30% + 12px); left:5%; width:24px; height:26px; background:#CD853F; border-radius:0 0 8px 8px; border:2px solid #8B4513; z-index:6; }
        .flower-pot::after { content:'🌿'; position:absolute; top:-16px; left:2px; font-size:1rem; }
        .purple-bg { position:absolute; bottom:0; left:0; right:0; top:70%; background:purple; z-index:1; }
        .kitchen-area { position:absolute; bottom:18%; left:0; right:0; height:35%; z-index:2; }
        .table { position:absolute; top:50%; left:5%; right:5%; height:50%; background:linear-gradient(180deg, #DEB887, #A0522D); border-top:6px solid #8B4513; }
        .stove { position:absolute; top:20%; left:25%; right:25%; height:45%; background:linear-gradient(180deg, #F5F5F5, #D3D3D3); border-radius:15px 15px 5px 5px; border:3px solid #A9A9A9; }
        .pot { position:absolute; top:5%; left:50%; transform:translateX(-50%); width:55%; height:60%; background:linear-gradient(180deg, #C0C0C0, #708090); border-radius:0 0 25px 25px; border:3px solid #2F4F4F; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:3; }
        .pot::after { content:''; position:absolute; top:-10px; left:-3px; right:-3px; height:10px; background:#A9A9A9; border-radius:5px; }
        .steam { position:absolute; top:-18px; left:50%; transform:translateX(-50%); width:70%; height:18px; }
        .steam-particle { position:absolute; width:10px; height:10px; background:rgba(255,255,255,0.7); border-radius:50%; animation:rise 2s infinite; }
        .steam-particle:nth-child(1){ left:20%; animation-delay:0s; }
        .steam-particle:nth-child(2){ left:50%; animation-delay:0.7s; }
        .steam-particle:nth-child(3){ left:70%; animation-delay:1.4s; }
        @keyframes rise { 0%{ transform:translateY(0) scale(1); opacity:0.7; } 100%{ transform:translateY(-20px) scale(1.5); opacity:0; } }
        .energy-on-pot { background:rgba(0,0,0,0.7); color:#FFD700; padding:2px 10px; border-radius:10px; font-size:0.75rem; font-weight:bold; z-index:4; margin-top:5px; }
        .pot .start-btn { background:linear-gradient(180deg, #FF6347, #DC143C); color:white; border:none; padding:8px 18px; border-radius:15px; font-weight:bold; font-size:0.9rem; cursor:pointer; z-index:4; margin-top:4px; }
        .pot .start-btn:disabled { background:#808080; cursor:not-allowed; }
        .board { position:absolute; bottom:8%; left:50%; transform:translateX(-50%); width:88%; background:#DEB887; border-radius:10px; border:3px solid #8B4513; display:flex; flex-direction:column; padding:8px; gap:8px; z-index:10; }
        .row { display:flex; justify-content:space-around; }
        .hole { background:radial-gradient(circle, #2F1B0E, #1A0F07); border-radius:50%; border:2px solid #3D2B1F; display:flex; justify-content:center; align-items:center; cursor:pointer; position:relative; transition:transform 0.1s; width:55px; height:55px; }
        .hole:active { transform:scale(0.85); }
        .veg { font-size:1.8rem; pointer-events:none; animation:popIn 0.3s ease-out; }
        @keyframes popIn { 0%{ transform:scale(0); } 80%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
        .rotten { filter:brightness(0.7) sepia(0.5) hue-rotate(-15deg); }
        .rotten::after { content:'🪱'; position:absolute; top:-6px; right:-6px; font-size:0.6rem; }
        .top-left-buttons { position:absolute; top:5px; left:5px; display:flex; gap:4px; z-index:35; flex-wrap:wrap; }
        .top-left-buttons .item { background:rgba(0,0,0,0.65); color:white; padding:3px 8px; border-radius:12px; font-size:0.65rem; display:flex; align-items:center; gap:3px; cursor:pointer; }
        .balances { position:absolute; top:5px; right:5px; display:flex; flex-direction:column; align-items:flex-end; gap:3px; z-index:35; }
        .balances div { background:rgba(0,0,0,0.75); color:white; padding:3px 10px; border-radius:12px; font-size:0.7rem; font-weight:bold; }
        .bottom-panel { position:absolute; bottom:2px; left:2px; right:2px; display:flex; justify-content:space-around; z-index:30; }
        .nav-btn { background:rgba(0,0,0,0.75); color:white; border:none; padding:10px 6px; border-radius:10px; font-size:0.75rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; margin:2px; font-weight:bold; letter-spacing:0.5px; }
        .nav-btn.active { background:rgba(255,215,0,0.8); color:black; }
        .screen { display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.9); color:white; padding:20px; flex-direction:column; align-items:center; justify-content:flex-start; z-index:40; overflow-y:auto; }
        .screen.active { display:flex; }
        .back-btn { position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.3); color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; }
        .flying-veg { position:absolute; z-index:20; pointer-events:none; animation: flyToPot 0.5s ease-in forwards; }
        @keyframes flyToPot { 0% { transform: translate(0, 0) scale(1); opacity:1; } 50% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity:1; } 100% { transform: translate(var(--ex), var(--ey)) scale(0.5); opacity:0; } }
        .coin-fountain { position:absolute; pointer-events:none; animation: coinUp 1s ease-out forwards; z-index:25; }
        @keyframes coinUp { 0% { transform:translateY(0) scale(1); opacity:1; } 100% { transform:translateY(-60px) scale(0.3); opacity:0; } }
        .task-item { background:rgba(255,255,255,0.1); padding:10px; margin:8px 0; border-radius:8px; display:flex; flex-direction:column; gap:8px; }
        .task-item input, .task-item select { padding:8px; border-radius:5px; border:none; width:100%; background: rgba(255,255,255,0.15); color: white; }
        .task-item button { padding:8px 12px; border:none; border-radius:5px; font-weight:bold; background:#FFD700; color:black; }
        .sub-tab { padding:8px 14px; border:none; border-radius:20px; font-weight:bold; font-size:0.75rem; cursor:pointer; background:#333; color:#aaa; transition: all 0.2s; box-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .sub-tab.active { background: linear-gradient(135deg, #FFD700, #FF8C00); color:black; animation: pulse 1.5s infinite; box-shadow: 0 0 15px rgba(255,215,0,0.8); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
<div id="game-container">
    <!-- Терминал (уже сдвинут) -->
    <div id="terminal">
        <div class="ticker-bar">
            <div class="ticker-left" id="ticker-left"></div>
            <div class="coin-tabs" id="coin-tabs">
                <button class="coin-tab active" data-coin="bitcoin">BTC</button>
                <button class="coin-tab" data-coin="ethereum">ETH</button>
                <button class="coin-tab" data-coin="toncoin">TON</button>
                <button class="coin-tab" data-coin="solana">SOL</button>
                <button class="coin-tab" data-coin="dogecoin">DOGE</button>
                <button class="coin-tab" data-coin="srum">SRUM</button>
            </div>
        </div>
        <div id="chart-container">
            <canvas id="chartCanvas"></canvas>
            <div class="order-book" id="order-book"></div>
        </div>
    </div>
    <div class="glass-wall"></div>
    <div class="window-sill"></div>
    <div class="flower-pot"></div>
    <div class="purple-bg"></div>

    <div class="kitchen-area">
        <div class="table"></div>
        <div class="stove">
            <div class="pot" id="pot">
                <div class="steam"><div class="steam-particle"></div><div class="steam-particle"></div><div class="steam-particle"></div></div>
                <div class="energy-on-pot" id="energy-on-pot">⚡ 60/60</div>
                <button class="start-btn" id="start-btn">🥘 НАЧАТЬ</button>
            </div>
        </div>
    </div>

    <div class="board" id="board">
        <div class="row">
            <div class="hole" data-hole="0"></div><div class="hole" data-hole="1"></div><div class="hole" data-hole="2"></div><div class="hole" data-hole="3"></div><div class="hole" data-hole="4"></div>
        </div>
        <div class="row">
            <div class="hole" data-hole="5"></div><div class="hole" data-hole="6"></div><div class="hole" data-hole="7"></div><div class="hole" data-hole="8"></div>
        </div>
    </div>

    <div class="top-left-buttons">
        <div class="item" id="top-tappers">🏆 Топ</div>
        <div class="item" id="top-miners">⛏️ Майнеры</div>
        <div class="item" id="referral-icon">👥</div>
        <div class="item" id="rules-btn">📜 Правила</div>
        <div class="item" id="about-icon">📖 О проекте</div>
    </div>

    <div class="balances">
        <div id="rum-balance">💰 RUM: 0</div>
        <div id="invest-balance">📈 Инвест: 0</div>
        <div id="srum-balance">💎 SRUM: 0.00</div>
    </div>

    <div class="bottom-panel">
        <button class="nav-btn" data-screen="arena">🏟️<br>Арена</button>
        <button class="nav-btn" data-screen="mining-club">🐺<br>Клуб</button>
        <button class="nav-btn" data-screen="tasks">📋<br>Задания</button>
        <button class="nav-btn" data-screen="invest">📈<br>Инвест</button>
        <button class="nav-btn" data-screen="wallet">👛<br>Кошелёк</button>
        <button class="nav-btn" data-screen="shop">🛍️<br>Магазин</button>
    </div>

    <!-- Экраны -->
    <div class="screen" id="arena-screen"><button class="back-btn">← Назад</button>🏟️ Арена (турниры)</div>
    <div class="screen" id="mining-club-screen">
        <button class="back-btn">← Назад</button>
        <h2>🐺 Бойцовский клуб «Голодные волки»</h2>
        <div style="display:flex; gap:8px; margin:10px 0;">
            <button id="club-my-btn" style="padding:8px 12px; background:#FFD700; border:none; border-radius:8px; color:black;">Мой клуб</button>
            <button id="club-all-btn" style="padding:8px 12px; background:#2196F3; border:none; border-radius:8px;">Все клубы</button>
            <button id="club-create-btn" style="padding:8px 12px; background:#4CAF50; border:none; border-radius:8px;">Создать</button>
        </div>
        <div id="club-content" style="width:100%; max-height:60%; overflow-y:auto;"></div>
    </div>

    <div class="screen" id="tasks-screen">
        <button class="back-btn">← Назад</button>
        <h2>📋 Задания</h2>
        <div style="display:flex; gap:8px; margin:15px 0;">
            <button id="tasks-available-btn" style="padding:8px 12px; background:#FFD700; border:none; border-radius:8px; color:black;">Доступные</button>
            <button id="tasks-create-btn" style="padding:8px 12px; background:#4CAF50; border:none; border-radius:8px;">Создать</button>
            <button id="tasks-my-btn" style="padding:8px 12px; background:#2196F3; border:none; border-radius:8px;">Мои</button>
        </div>
        <div id="tasks-sub-tabs" style="display:flex; gap:8px; margin-bottom:10px;">
            <button class="sub-tab active" data-tab="borsch">Крипто Борщ</button>
            <button class="sub-tab" data-tab="private_rum">Частные (RUM)</button>
            <button class="sub-tab" data-tab="private_srum">Частные (SRUM)</button>
            <button class="sub-tab" data-tab="srum">За СилаРум</button>
        </div>
        <div id="tasks-content" style="width:100%; max-height:60%; overflow-y:auto;"></div>
    </div>
    <div class="screen" id="invest-screen"><button class="back-btn">← Назад</button>📈 Инвестиции</div>
    <div class="screen" id="wallet-screen"><button class="back-btn">← Назад</button>👛 Кошелёк</div>
    <div class="screen" id="shop-screen"><button class="back-btn">← Назад</button>🛍️ Магазин</div>
    <div class="screen" id="top-tappers-screen"><button class="back-btn">← Назад</button>🏆 Топ игроков</div>
    <div class="screen" id="top-miners-screen"><button class="back-btn">← Назад</button>⛏️ Топ майнеров</div>
    <div class="screen" id="referral-screen"><button class="back-btn">← Назад</button>👥 Рефералы</div>
    <div class="screen" id="rules-screen"><button class="back-btn">← Назад</button><h2>📜 Правила</h2><p>Тапай овощи, зарабатывай RUM, создавай клубы.</p></div>
    <div class="screen" id="about-screen"><button class="back-btn">← Назад</button>📖 О проекте</div>
</div>

<script>
(function() {
    // Игровое ядро
    const GOOD = ['🥬','🧅','🥔','🥕','🫑','🌿','🫘','🧄','🍅'];
    const BAD = ['💩','🪱','🧀','🥀','🍄'];
    let rum = parseInt(localStorage.getItem('rum') || '0');
    let invest = parseInt(localStorage.getItem('invest') || '0');
    let srum = parseFloat(localStorage.getItem('srum') || '0');
    let energy = parseInt(localStorage.getItem('energy') || '60');
    const maxEnergy = 60;
    let gameActive = false, gameTimer, gameTimeLeft = 60, spawnInterval, currentVeg = {};

    let officialRumTasks = JSON.parse(localStorage.getItem('officialRumTasks')) || [
        { id:1, desc:'Подписаться на канал', reward:50, link:'', maxCompletions:100, completionsDone:0, checking:false },
        { id:2, desc:'Сделать репост', reward:100, link:'', maxCompletions:100, completionsDone:0, checking:false },
        { id:3, desc:'Пригласить друга', reward:200, link:'', maxCompletions:100, completionsDone:0, checking:false },
        { id:4, desc:'Сыграть 5 раундов', reward:300, link:'', maxCompletions:100, completionsDone:0, checking:false }
    ];
    let officialSrumTasks = JSON.parse(localStorage.getItem('officialSrumTasks')) || [
        { id:101, desc:'Подпишись на Twitter', reward:0.1, link:'', maxCompletions:100, completionsDone:0, checking:false },
        { id:102, desc:'Поставь лайк проекту', reward:0.15, link:'', maxCompletions:100, completionsDone:0, checking:false }
    ];
    let globalUserTasks = JSON.parse(localStorage.getItem('globalUserTasks')) || [];
    let userTasks = JSON.parse(localStorage.getItem('userTasks')) || [];
    let clubs = JSON.parse(localStorage.getItem('clubs')) || [];
    let myClubId = localStorage.getItem('myClubId') || null;

    function saveAll() {
        localStorage.setItem('rum', rum); localStorage.setItem('invest', invest); localStorage.setItem('srum', srum);
        localStorage.setItem('energy', energy);
        localStorage.setItem('officialRumTasks', JSON.stringify(officialRumTasks));
        localStorage.setItem('officialSrumTasks', JSON.stringify(officialSrumTasks));
        localStorage.setItem('globalUserTasks', JSON.stringify(globalUserTasks));
        localStorage.setItem('userTasks', JSON.stringify(userTasks));
        localStorage.setItem('clubs', JSON.stringify(clubs));
        if (myClubId) localStorage.setItem('myClubId', myClubId); else localStorage.removeItem('myClubId');
    }

    const pot = document.getElementById('pot');
    const board = document.getElementById('board');
    const rumBal = document.getElementById('rum-balance');
    const investBal = document.getElementById('invest-balance');
    const srumBal = document.getElementById('srum-balance');
    const energyOnPot = document.getElementById('energy-on-pot');
    const startBtn = document.getElementById('start-btn');
    const holes = document.querySelectorAll('.hole');

    function updateUI() {
        rumBal.textContent = `💰 RUM: ${rum}`;
        investBal.textContent = `📈 Инвест: ${invest}`;
        srumBal.textContent = `💎 SRUM: ${srum.toFixed(2)}`;
        energyOnPot.textContent = `⚡ ${energy}/${maxEnergy}`;
        if (energy === maxEnergy && !gameActive) {
            startBtn.disabled = false; startBtn.textContent = '🥘 НАЧАТЬ'; startBtn.style.display = 'block';
        } else if (gameActive) startBtn.style.display = 'none';
        else { startBtn.disabled = true; startBtn.textContent = `⏳ ${Math.ceil((maxEnergy-energy)*6/60)} мин`; startBtn.style.display = 'block'; }
        saveAll();
    }

    function spawnAll() {
        holes.forEach(h => h.innerHTML = '');
        currentVeg = {};
        const holeElements = [...holes];
        for (let i = 0; i < holeElements.length; i++) {
            const isBad = Math.random() < 0.25;
            const pool = isBad ? BAD : GOOD;
            const emoji = pool[Math.floor(Math.random() * pool.length)];
            const el = document.createElement('span');
            el.className = 'veg' + (isBad ? ' rotten' : '');
            el.textContent = emoji;
            holeElements[i].appendChild(el);
            currentVeg[i] = { type: isBad ? 'bad' : 'good', emoji };
        }
    }

    function showCoinFountain() {
        const potRect = pot.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const cx = potRect.left + potRect.width/2 - containerRect.left;
        const cy = potRect.top - containerRect.top;
        for (let i=0; i<7; i++) {
            const coin = document.createElement('div'); coin.className = 'coin-fountain'; coin.textContent = '💰';
            coin.style.left = (cx + (Math.random()-0.5)*40) + 'px';
            coin.style.top = (cy + (Math.random()-0.5)*10) + 'px';
            coin.style.animationDuration = (0.8 + Math.random()*0.5) + 's';
            document.getElementById('game-container').appendChild(coin);
            coin.addEventListener('animationend', () => coin.remove());
        }
    }

    function processHit(hole, touch) {
        if (!gameActive) return;
        const num = [...holes].indexOf(hole);
        if (num === -1 || !currentVeg[num]) { rum = Math.max(0, rum-5); updateUI(); return; }
        const vegData = currentVeg[num];
        if (vegData.type === 'good') { rum += 10; flyVegToPot(hole, vegData.emoji); showCoinFountain(); showEffect(touch.clientX, touch.clientY, '+10', 'gold'); }
        else { rum = Math.max(0, rum-5); showEffect(touch.clientX, touch.clientY, '✖', 'red'); }
        delete currentVeg[num]; hole.innerHTML = ''; updateUI();
    }

    function handleTouchStart(e) {
        e.preventDefault();
        if (!gameActive) return;
        [...e.changedTouches].forEach(touch => {
            const hole = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.hole');
            if (hole) processHit(hole, touch); else { rum = Math.max(0, rum-5); updateUI(); }
        });
    }

    function flyVegToPot(hole, emoji) {
        const holeRect = hole.getBoundingClientRect();
        const potRect = pot.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const vegEl = document.createElement('div'); vegEl.className = 'flying-veg'; vegEl.textContent = emoji;
        vegEl.style.left = (holeRect.left + holeRect.width/2 - containerRect.left) + 'px';
        vegEl.style.top = (holeRect.top + holeRect.height/2 - containerRect.top) + 'px';
        vegEl.style.setProperty('--dx', (potRect.left + potRect.width/2 - containerRect.left - parseFloat(vegEl.style.left)) / 2 + 'px');
        vegEl.style.setProperty('--dy', '-50px');
        vegEl.style.setProperty('--ex', (potRect.left + potRect.width/2 - containerRect.left - parseFloat(vegEl.style.left)) + 'px');
        vegEl.style.setProperty('--ey', (potRect.top + potRect.height*0.3 - containerRect.top - parseFloat(vegEl.style.top)) + 'px');
        document.getElementById('game-container').appendChild(vegEl);
        vegEl.addEventListener('animationend', () => vegEl.remove());
    }

    function showEffect(x, y, text, color) {
        const el = document.createElement('div');

        el.textContent = text;

        el.style.left = (x - cr.left) + 'px'; el.style.top = (y - cr.top) + 'px';

    function startGame() {

        gameActive = true; gameTimeLeft = 60; energy = maxEnergy;
        updateUI(); spawnAll();
        let interval = 1800;
        spawnInterval = setInterval(() => {
            if (!gameActive) return;
            spawnAll();
            interval = Math.max(450, interval-80);
            clearInterval(spawnInterval);
            spawnInterval = setInterval(() => { if (gameActive) spawnAll(); }, interval);
        }, interval);
        gameTimer = setInterval(() => { gameTimeLeft--; energy--; updateUI(); if (gameTimeLeft <= 0) endGame(); }, 1000);
    }

    function endGame() {
        gameActive = false;
        clearInterval(gameTimer); clearInterval(spawnInterval);
        holes.forEach(h => h.innerHTML = '');

    function startRecovery() {

    function resizeCanvas() {

    function startDemo() {
        chartData = [];
        let price = coinPrices[currentCoin] || 60000;
        const isSrum = currentCoin === 'srum';
        for (let i=0; i<40; i++) {
            if (isSrum) price += 0.002 + Math.random()*0.001; // всегда рост
            else price += (Math.random()-0.5) * (price*0.005);
            chartData.push({ time: Date.now() - (40-i)*1500, price });
        }
        drawChart();
        const demoInterval = setInterval(() => {
            if (currentCoin !== document.querySelector('.coin-tab.active')?.dataset.coin) {
                clearInterval(demoInterval); return;
            }
            if (!chartData.length) return;
            const last = chartData[chartData.length-1];
            let newPrice;
            if (isSrum) newPrice = last.price + 0.002 + Math.random()*0.001;
            else newPrice = last.price + (Math.random()-0.5) * (last.price*0.003);
            chartData.push({ time: Date.now(), price: newPrice });
            if (chartData.length > 100) chartData.shift();
            drawChart();
            updateOrderBook(newPrice);
        }, 800);
        // сохраним интервал для очистки
        canvas.demoInterval = demoInterval;
    }

    function drawChart() {
        if (!ctx || chartData.length < 2) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const prices = chartData.map(d => d.price);
        const min = Math.min(...prices)*0.999, max = Math.max(...prices)*1.001, r = max-min || 1;
        const stepX = canvas.width / (chartData.length-1);
        // Свечи
        for (let i=1; i<chartData.length; i++) {
            const open = chartData[i-1].price, close = chartData[i].price;
            const x = (i-1)*stepX + stepX*0.1;
            const w = stepX*0.8;
            const yOpen = canvas.height - ((open-min)/r)*canvas.height;
            const yClose = canvas.height - ((close-min)/r)*canvas.height;
            ctx.fillStyle = close >= open ? '#4CAF50' : '#F44336';
            ctx.fillRect(x, Math.min(yOpen, yClose), w, Math.abs(yClose - yOpen) || 1);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, Math.min(yOpen, yClose), w, Math.abs(yClose - yOpen) || 1);
        }
        // Линия скользящей средней (простая)
        ctx.beginPath();
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 1.5;
        for (let i=0; i<chartData.length; i++) {
            const x = i*stepX;
            let sum = 0, count = 0;
            for (let j=Math.max(0,i-5); j<=i; j++) { sum += chartData[j].price; count++; }
            const avg = sum/count;
            const y = canvas.height - ((avg-min)/r)*canvas.height;
            if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
        // Текущая цена
        const last = chartData[chartData.length-1];
        const ly = canvas.height - ((last.price-min)/r)*canvas.height;
        ctx.strokeStyle = '#aaa';
        ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(canvas.width, ly); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = '9px Arial';
        ctx.fillText(last.price.toFixed(currentCoin==='srum'?4:2), canvas.width-65, ly-6);
    }

    function updateOrderBook(price) {
        const book = document.getElementById('order-book');
        const spread = price * 0.0005;
        let html = '<div style="font-weight:bold;margin-bottom:4px;">Стакан</div>';
        for (let i=14; i>=1; i--) {
            html += `<div class="order-row ask"><span>${(price + spread*i).toFixed(currentCoin==='srum'?4:2)}</span><span>${Math.floor(Math.random()*15)}</span></div>`;
        }
        html += `<div class="order-row" style="color:#FFD700;font-weight:bold;">${price.toFixed(currentCoin==='srum'?4:2)}</div>`;
        for (let i=1; i<=15; i++) {
            html += `<div class="order-row bid"><span>${(price - spread*i).toFixed(currentCoin==='srum'?4:2)}</span><span>${Math.floor(Math.random()*15)}</span></div>`;
        }
        book.innerHTML = html;
    }

    async function fetchRealData() {
        if (currentCoin === 'srum') return; // SRUM локальный
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,toncoin,solana,dogecoin');
            const data = await res.json();
            const tickerLeft = document.getElementById('ticker-left');
            let html = '';
            data.forEach(coin => {
                const ch = coin.price_change_percentage_24h?.toFixed(2)||'0';
                html += `<div class="ticker-item"><span class="sym">${coin.symbol.toUpperCase()}</span> $${coin.current_price.toLocaleString()} <span class="change ${ch>=0?'positive':'negative'}">${ch}%</span></div>`;
                if (coin.id === currentCoin) {
                    chartData.push({ time: Date.now(), price: coin.current_price });
                    if (chartData.length > 100) chartData.shift();
                    drawChart();
                    updateOrderBook(coin.current_price);
                }
            });
            // добавим SRUM в тикер, если его нет
            if (!data.find(c => c.id === 'srum')) {
                const srumPrice = chartData.length ? chartData[chartData.length-1].price : 1.0;
                html += `<div class="ticker-item"><span class="sym">SRUM</span> $${srumPrice.toFixed(4)} <span class="change positive">+0.5%</span></div>`;
            }
            tickerLeft.innerHTML = html;
        } catch(e) {}
    }

        document.querySelectorAll('.edit-task-btn').forEach(btn => btn.addEventListener('click', (e) => {

            if (!task) return;
            const newDesc = document.getElementById(`desc-${taskId}`).value.trim();
            const newReward = parseFloat(document.getElementById(`reward-${taskId}`).value);
            const newLink = document.getElementById(`link-${taskId}`).value.trim();
            if (!newDesc || newReward <= 0) return alert('Неверное описание или награда');
            const diff = newReward - task.reward;
            if (diff > 0) {
                if (task.currency === 'RUM' && rum >= diff) rum -= Math.ceil(diff);
                else if (task.currency === 'SRUM' && srum >= diff) srum -= diff;
                else return alert('Недостаточно средств');
            } else if (diff < 0) {
                if (task.currency === 'RUM') rum += Math.ceil(-diff);
                else srum += -diff;
            }
            task.desc = newDesc; task.reward = newReward; task.link = newLink;
            updateUI(); renderMyTasks(); alert('Задание обновлено!');
        }));
        document.querySelectorAll('.delete-task-btn').forEach(btn => btn.addEventListener('click', (e) => {
            const taskId = parseInt(e.target.dataset.taskId);
            const taskIndex = userTasks.findIndex(t => t.id === taskId);

            if (globalIndex !== -1) globalUserTasks.splice(globalIndex, 1);
            updateUI(); renderMyTasks(); alert('Задание удалено, средства возвращены');
        }));
    }

    // Навигация
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if (screenId === 'tasks') { document.getElementById('tasks-screen').classList.add('active'); renderAvailableTasks(); }
        else if (screenId === 'mining-club') { document.getElementById('mining-club-screen').classList.add('active'); renderMyClub(); }
        else if (screenId !== 'main') { const t = document.getElementById(screenId+'-screen'); if(t) t.classList.add('active'); }
    }

    board.addEventListener('touchstart', handleTouchStart, {passive: false});
    board.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
    startBtn.addEventListener('click', startGame);
    document.getElementById('top-tappers').addEventListener('click', ()=> switchScreen('top-tappers'));
    document.getElementById('top-miners').addEventListener('click', ()=> switchScreen('top-miners'));
    document.getElementById('referral-icon').addEventListener('click', ()=> switchScreen('referral'));
    document.getElementById('rules-btn').addEventListener('click', ()=> switchScreen('rules'));
    document.getElementById('about-icon').addEventListener('click', ()=> switchScreen('about'));
    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', e => switchScreen(e.currentTarget.dataset.screen)));
    document.querySelectorAll('.back-btn').forEach(b => b.addEventListener('click', () => document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))));
    document.getElementById('tasks-available-btn').addEventListener('click', ()=>{ currentTasksTab='borsch'; renderAvailableTasks(); });
    document.getElementById('tasks-create-btn').addEventListener('click', renderCreateTask);
    document.getElementById('tasks-my-btn').addEventListener('click', renderMyTasks);

    updateUI();
    startRecovery();
    document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
})();
</script>
</body>
</html>
